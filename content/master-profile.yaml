# Master profile: the single source of truth for every CV this app produces.
#
# Rules:
# - Edited by hand only. The LLM selects and lightly rewords; it never adds facts.
# - Every number is either VERIFIED (git, production logs, work mail, Drive, Razorpay
#   exports; handover of 2026-10-05/06) or STATED by Rayan. Each metric carries a
#   comment saying which. Do not add a figure without a source.
# - Bullet `metrics` hold the figures for that bullet. The validator rejects any number
#   in tailored text that is not in the bullet's variants or metrics.
# - `rank`: higher = more important. The overflow fitter drops the lowest rank first.
# - `default`: included in the untailored default CV (npm run render:default).
# - Wording rules: "platform holding 1M+ enrollment records" is allowed; never
#   "1M+ enrollments handled". "10M+" is records (attendance, results, enrollments),
#   never enrollments. No first person ("I", "my") in bullets.
#
# Changes vs previous version (2026-10-06):
# - BRDs 10+ -> 15+, staff 100+ -> 500+, reports 84 -> 150+ (stated by Rayan)
# - Added Razorpay collections (Rs 4 Cr+, 2,500+ payments, Jul-Aug 2026; verified). 2026-10-07: totals
#   now include the second receivables portal (Rs 4 Cr+, Rs 100 Cr+, 100,000+, 30+ doctypes)
# - Added Metabase automation of App -> CRM -> ERP check (stated)
# - Added collections-reporting bullet and platform-scale bullet
# - Removed xa_ops_reports (those reports were not Rayan's) and the "5 fee heads" detail
# - Fixed "2.5 years at Xylem" wording; Outlier no longer optional (summaries say 2.5 yrs)
# - Moved scale bullet (records, imports) to the lead role, since it runs into 2026
# - Removed duplicate clauses between bullets so the fitter can't repeat a fact
# - 2024-25 title confirmed as "Product Analyst" (was "Analyst (MIS & ERP)"); Rivlo is at beta,
#   so its bullets say beta, not deployment
#
# Changes 2026-10-07 (audit of work Gmail, Drive, xylem git, Rivlo code):
# - Admission Portal launch Sep 2026 -> Apr 2026 (go-live email Apr 25 2026; the Sep 23 2026
#   email was Rayan's all-staff intro draft, sent to Sahbir only)
# - Parent web app (xylem www/student_fee_details) credited to Rayan: built by him, committed
#   from Ganu's device (git shows ganureddypw); go-live emails Apr 29 2026 (online) and
#   May 27 2026 (offline batches). Own bullet added: xl_parent_app
# - 1M+ enrollment records now VERIFIED (1,212,958, prod Query Report 2026-10-05)
# - Staff 500+, reports 150+, team of 5, Ragam and certificates marked VERIFIED on Rayan's
#   confirmation (2026-10-07); no document evidence found for these
# - Added: portal payment volume, user feedback, in-app refund go-live, Meal Tracker, exam
#   analytics, Report Builder + teacher dashboard, audit support, approval/SOP process work,
#   vendor/PII data-flow mapping, 2025 RCAs, pre-git builds, training; Rivlo readiness score,
#   question quality, CAT vertical
# - Core bullets (`core: true`) appear on every CV that includes their section and are never
#   dropped by the page fitter: xl_portal, xl_payments, and rv_build (Rivlo's anchor, only when
#   Rivlo is on the CV). Kept to 2 on the current role so its other 2-4 slots stay tailored;
#   everything else relies on rank. xl_payments now merges the former xl_portal_volume;
#   xl_modules is new (rank 75); the static-QR RCA is left out; xa_reconciliation rank 95 -> 70

# The wording rules above, as data: every prompt (CV, fit analysis, cover letter) includes
# these, since YAML comments never reach the model.
wording_rules:
  - '"Platform holding 1M+ enrollment records" is allowed; never write "1M+ enrollments handled".'
  - '"10M+" is records (attendance, results, enrollments), never enrollments.'
  - 'No first person ("I", "my") in CV bullets, headline or summary.'

